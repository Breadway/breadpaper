[package]
name = "breadpaper"
version = "0.1.15"
edition = "2024"
description = "Wallpaper manager for the bread desktop"
# Not just MIT: breadpaper always builds bread-theme with its `extract`
# feature (palette extraction is breadpaper's whole purpose), which
# statically links bread-palette-extract's ImageMagick/libjpeg-turbo (IJG)
# port. See NOTICE, LICENSE-ImageMagick and LICENSE-libjpeg-turbo, also
# printed by `breadpaper notice`.
license = "MIT AND ImageMagick AND IJG"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
gtk4 = { version = "0.11", features = ["v4_12"] }
bread-theme = { git = "https://git.breadway.dev/Breadway/bread-ecosystem", branch = "feature/native-palette", features = ["gtk", "extract"] }
bread-utils = { git = "https://git.breadway.dev/Breadway/bread-ecosystem", tag = "v0.7.2", features = ["bread-client"] }
